services:
  db:
    image: mysql:8.0
    container_name: fptstore_yii_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii2basic
      MYSQL_USER: yii
      MYSQL_PASSWORD: yii123
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  yii:
    image: yiisoftware/yii2-php:8.2-apache
    container_name: fptstore_yii_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: yii2basic
      DB_USER: yii
      DB_PASSWORD: yii123
      YII_ENV: dev
      YII_DEBUG: 1
    volumes:
      - ./yii-app:/app
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
    command: >
      bash -lc "
      composer install --prefer-dist --no-interaction || true;
      php yii migrate --interactive=0 || true;
      apache2-foreground
      "

  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: fptstore_wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - wordpress_data:/var/www/html

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: fptstore_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  mysql_data:
  wordpress_data:
